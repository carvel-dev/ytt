name: go-updater

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: Update Go
        run: |
          set -euo pipefail

          BEFORE_MINOR=$(grep -E '^go [0-9]' go.mod | awk '{print $2}' | cut -d. -f2)

          go get go

          AFTER_MINOR=$(grep -E '^go [0-9]' go.mod | awk '{print $2}' | cut -d. -f2)

          if [ "$BEFORE_MINOR" != "$AFTER_MINOR" ]; then
            LINT_VERSION=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/golangci/golangci-lint/releases/latest \
              | jq -r '.tag_name')

            # Trim to vMAJOR.MINOR to match existing "version: v2.4" format
            LINT_VERSION_SHORT=$(echo "$LINT_VERSION" | grep -oE '^v[0-9]+\.[0-9]+')

            sed -i "s|^\([[:space:]]*version:[[:space:]]*\)v[0-9][0-9]*\.[0-9][0-9]*|\1${LINT_VERSION_SHORT}|" \
              .github/workflows/golangci-lint.yml

            {
              echo 'COMMIT_MSG<<EOF'
              echo "Bump go and golangci-lint to ${LINT_VERSION_SHORT}"
              echo ""
              echo "Signed-off-by: Carvel Bot <svc.bot.carvel@vmware.com>"
              echo 'EOF'
            } >> "$GITHUB_ENV"
            echo "PR_TITLE=Bump go and golangci-lint to ${LINT_VERSION_SHORT}" >> "$GITHUB_ENV"
          else
            {
              echo 'COMMIT_MSG<<EOF'
              echo "Bump go"
              echo ""
              echo "Signed-off-by: Carvel Bot <svc.bot.carvel@vmware.com>"
              echo 'EOF'
            } >> "$GITHUB_ENV"
            echo "PR_TITLE=Bump go" >> "$GITHUB_ENV"
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          token: ${{ secrets.CARVEL_BOT_ACCESS_TOKEN }}
          committer: Carvel Bot <svc.bot.carvel@vmware.com>
          author: Carvel Bot <svc.bot.carvel@vmware.com>
          commit-message: ${{ env.COMMIT_MSG }}
          title: ${{ env.PR_TITLE }}
          delete-branch: true
          body: |
            Auto-generated by https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
            Signed-off-by: Carvel Bot <svc.bot.carvel@vmware.com>
          base: develop
          branch: bump-go
